<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WorkLog">
<meta name="theme-color" content="#f4f5f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>WorkLog</title>
<style>
:root{
  --bg0:#f4f5f7; --tint:var(--bg0); --bg:color-mix(in srgb,var(--tint) 8%,var(--bg0)); --card:#ffffff; --ink:#111827; --mute:#6b7280; --line:#e5e7eb;
  --accent:var(--co-accent,#1d4ed8); --on-accent:var(--co-on,#fff); --danger:#dc2626; --ok:#059669; --warn:#b45309; --chip:#eef0f3;
}
@media (prefers-color-scheme:dark){
  :root{--bg0:#0b0f17; --card:#151b26; --ink:#eef1f6; --mute:#94a0b3; --line:#263042;
    --accent:var(--co-accent,#60a5fa); --on-accent:var(--co-on,#0b0f17); --danger:#f87171; --ok:#34d399; --warn:#fbbf24; --chip:#1e2633;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
header{flex-wrap:wrap}
header h1{font-size:26px;margin:0;flex:1;letter-spacing:-.02em}
#coBar{flex-basis:100%;display:none;align-items:center;gap:8px;margin-top:8px;padding:8px 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
#coBar.on{display:flex}
#coBar .pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;animation:pl 2s infinite}
#coBar .el{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mute)}
@keyframes pl{50%{opacity:.35}}
#status{font-size:12px;color:var(--mute);text-align:right}
main{padding:4px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:var(--chip);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
.ghost{background:transparent;padding:8px}
.primary{background:var(--accent);color:var(--on-accent);font-weight:600}
html,body,header{transition:background-color .4s}
.danger{background:transparent;color:var(--danger);font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin:12px 0;border:1px solid var(--line)}
.label{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 6px}
.card .label{margin-top:0}
.cos{display:grid;grid-template-columns:1fr;gap:8px}
.co{background:color-mix(in srgb,var(--co) 9%,var(--card));color:var(--mute);font-weight:600;font-size:14px;padding:12px 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--co) 30%,var(--line));display:flex;align-items:center;justify-content:space-between;min-height:64px}
@media (prefers-color-scheme:dark){img.inv{filter:invert(1) brightness(.92)}}
.co img{height:36px;max-width:62%;object-fit:contain;object-position:left center}
.co.run{border:2px solid var(--co);color:var(--ink)}
.logochip{display:inline-flex;align-items:center;margin-bottom:6px}
.logochip img{height:20px;display:block}
.timer{border-left:6px solid var(--co)}
.timer .big{font-size:20px;font-weight:700;margin:2px 0}
.elapsed{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stop{width:100%;margin-top:10px;padding:14px;background:var(--danger);color:#fff}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.quick button{background:var(--card);border:1px solid var(--line);padding:16px 8px;font-weight:600}
.small{font-size:13px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.gap{gap:8px}.grow{flex:1}.wrap{flex-wrap:wrap}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--co)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;background:var(--co);vertical-align:middle}
.over{color:var(--danger);font-weight:600}
.due{color:var(--warn);font-weight:600}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--mute);padding:0;background:transparent;flex:none}
.tick.on{background:var(--ok);border-color:var(--ok)}
.wa{background:#25d366;color:#fff;font-weight:600;padding:8px 12px;flex:none}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 4px;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--mute);border-top:0}
td:first-child{font-weight:700}
td:not(:first-child),th:not(:first-child){text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip input{display:none}
.chip span,.fchip{display:inline-block;padding:8px 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:14px}
.chip input:checked+span,.fchip.on{background:var(--ink);color:var(--bg)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{position:relative;background:transparent;font-size:10.5px;font-weight:600;color:var(--mute);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px;line-height:1}
nav button.on{color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet.hidden{display:none}
.sheet-body{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet-head{display:flex;align-items:center}.sheet-head h2{flex:1;margin:0;font-size:20px}
.f{margin:12px 0}.f>label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:12px;width:100%;font-size:16px}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>.f{min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;min-height:48px;text-align:left}
.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.more summary{color:var(--mute);font-weight:600;font-size:14px;cursor:pointer;padding:6px 0}
.qd{cursor:pointer}
.pick{display:flex;gap:8px}.pick input{flex:1;min-width:0}.pick button{flex:none;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#toast.show{opacity:1}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;display:none}
.badge.on{display:block}
.mail{padding:11px 0;border-top:1px solid var(--line)}.mail:first-child{border-top:0}
.mail .t{font-weight:600;overflow-wrap:anywhere}.mail .snip{font-size:13px;color:var(--mute);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{padding:6px 11px;font-size:13px;font-weight:600;border-radius:9px}
.age{font-weight:600}.age.old{color:var(--danger)}
.grp{display:flex;align-items:baseline;gap:8px}
.thread .msg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.thread .msg>summary{cursor:pointer;list-style:none}
.thread .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5;margin-top:8px}
.thread .q .body{color:var(--mute);font-size:13px}
@media (min-width:1000px){.sheet-body{max-width:760px}}
.dash{display:grid;grid-template-columns:minmax(320px,1fr) minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.dash>div>.row{margin:12px 0 0}.dash>div>.row .label{margin:0}
.dash .card{margin-top:10px}
.brand{display:none}
@media (min-width:1000px){
  body{padding-left:230px}
  nav{top:0;bottom:0;left:0;right:auto;width:230px;display:flex;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:22px 14px}
  nav .brand{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;padding:4px 14px 18px;color:var(--ink)}
  nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 14px;border-radius:10px}
  nav .badge{position:static;margin-left:auto}
  nav button.on{background:color-mix(in srgb,var(--accent) 13%,transparent)}
  header{max-width:1400px;margin:0 auto;padding:22px 32px 6px}
  main{max-width:1400px;padding:4px 32px 40px}
  .sheet{align-items:center}.sheet-body{border-radius:20px;max-width:560px}
  #toast{bottom:30px}
  .item .main,.tick,.wa,.fchip,.co,[data-act]{cursor:pointer}
}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btnrow button{flex:1;min-width:120px}
</style>
</head>
<body>
<header><h1 id="title">WorkLog</h1><div id="status"></div><button class="ghost" data-act="go" data-arg="settings" aria-label="Settings">⚙︎</button><div id="coBar" data-act="go" data-arg="home"></div></header>
<main id="main"></main>
<nav id="nav">
  <div class="brand">WorkLog</div>
  <button data-act="go" data-arg="home" data-v="home"><i>◉</i>Home</button>
  <button data-act="go" data-arg="inbox" data-v="inbox"><i>✉︎</i>Inbox<span class="badge" id="mailBadge"></span></button>
  <button data-act="go" data-arg="hours" data-v="hours"><i>◷</i>Hours</button>
  <button data-act="go" data-arg="trips" data-v="trips"><i>✈︎</i>Trips</button>
  <button data-act="go" data-arg="tasks" data-v="tasks"><i>☑︎</i>Tasks</button>
  <button data-act="go" data-arg="followups" data-v="followups"><i>↻</i>Follow-ups</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast"></div>

<script>
/* ---------- data ---------- */

  else['--co-accent','--co-on','--tint'].forEach(k=>r.removeProperty(k));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.body).backgroundColor}

const logo=c=>LOGOS[c];
const logoImg=c=>`<img src="${logo(c)}" alt="${c}" class="${c==='PFTD'?'inv':''}">`;
const CATS=['Work','Meeting','Site visit','Travel'];
const TYPES=['hours','trips','notes','tasks','followups','mail'];
const BOOL=['deleted','done','personal','billsSubmitted'];
const NUM=['updatedAt','hrs','advance'];
const KEY='worklog.v1';
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){db={}}
TYPES.forEach(t=>db[t]=db[t]||[]);
db.queue=db.queue||{};db.settings=db.settings||{};db.last=db.last||{};db.view=db.view||'home';
db.taskFilter=db.taskFilter||'All';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Phone storage full')}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const nowTime=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const nowStamp=()=>today()+'T'+nowTime();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const live=t=>db[t].filter(r=>!r.deleted);
const doneH=()=>live('hours').filter(h=>h.end);
const T=()=>live('hours').filter(h=>!h.end).sort((a,b)=>b.start.localeCompare(a.start))[0]||null;
const WIDE=matchMedia('(min-width: 1000px)');
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDate(s,withDay){if(!s)return'';const[y,m,d]=s.slice(0,10).split('-').map(Number);
  const w=withDay?DAY[new Date(y,m-1,d).getDay()]+', ':'';return `${w}${d} ${MO[m-1]}`}
function fmtH(h){const m=Math.max(0,Math.round(h*60));return `${Math.floor(m/60)}h ${pad(m%60)}m`}
const diffH=(a,b)=>(new Date(b)-new Date(a))/3600000;
const sum=L=>L.reduce((a,x)=>a+(+x.hrs||0),0);
const rupee=n=>'₹ '+Number(n||0).toLocaleString('en-IN');
function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return dstr(d)}
const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y));
const projects=()=>uniq([...live('hours'),...live('tasks'),...live('followups')].map(x=>x.project));
const persons=()=>uniq(live('followups').map(x=>x.person));
const openTrip=()=>live('trips').find(t=>t.status!=='closed');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function norm(t,r){const o={...r};BOOL.forEach(k=>{if(k in o)o[k]=o[k]===true||String(o[k]).toLowerCase()==='true'});
  NUM.forEach(k=>{if(k in o&&o[k]!=='')o[k]=Number(o[k])});return o}

function put(t,r){r.updatedAt=Date.now();if(!r.id)r.id=uid();const L=db[t];const i=L.findIndex(x=>x.id===r.id);
  if(i>=0)L[i]=r;else L.push(r);db.queue[t+':'+r.id]={t,r};if(r.company)db.last.company=r.company;
  save();render();queueSync()}
function del(t,r){if(!confirm('Delete this?'))return false;r.deleted=true;put(t,r);return true}

/* ---------- sync with Google Sheet ---------- */
let syncTimer,syncing=false;
function queueSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),1500)}
async function sync(manual){
  const s=db.settings;
  if(!s.url){if(manual)toast('Add your Sheet link in Settings');setStatus();return}
  if(syncing)return;syncing=true;setStatus('Syncing…');
  const keys=Object.keys(db.queue);const sentAt={};
  const changes=keys.map(k=>{sentAt[k]=db.queue[k].r.updatedAt;return{type:db.queue[k].t,rec:db.queue[k].r}});
  try{
    const res=await fetch(s.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:s.token||'',changes})});
    const j=await res.json();if(!j.ok)throw new Error(j.error||'Sheet refused');
    keys.forEach(k=>{if(db.queue[k]&&db.queue[k].r.updatedAt===sentAt[k])delete db.queue[k]});
    TYPES.forEach(t=>(j.data[t]||[]).forEach(sr=>{sr=norm(t,sr);const L=db[t];const i=L.findIndex(x=>x.id===sr.id);
      if(i<0)L.push(sr);else if((sr.updatedAt||0)>(L[i].updatedAt||0)&&!db.queue[t+':'+sr.id])L[i]=sr}));
    s.lastSync=Date.now();save();if(!$('#sheet').classList.contains('hidden'))setStatus();else render();
    if(manual)toast('Synced with Sheet');
  }catch(e){if(manual)toast('Sync failed — '+e.message)}
  finally{syncing=false;setStatus()}
}
function setStatus(txt){
  const n=Object.keys(db.queue).length;let m=txt;
  if(!m){if(!db.settings.url)m='Not linked';
    else if(!navigator.onLine)m=n?`Offline · ${n} to sync`:'Offline';
    else if(n)m=`${n} to sync`;
    else if(db.settings.lastSync){const d=new Date(db.settings.lastSync);m=`Synced ${pad(d.getHours())}:${pad(d.getMinutes())}`}
    else m='';}
  $('#status').textContent=m;
}

/* ---------- forms (bottom sheet) ---------- */
let formState=null;
function field(f,v){
  const id='f_'+f.k;
  if(f.type==='company'||f.type==='choice'){
    const opts=f.type==='company'?COS:f.options;
    return `<div class="f"><label>${esc(f.label)}</label><div class="chips">${opts.map(o=>
      `<label class="chip"><input type="radio" name="${id}" value="${esc(o)}" ${v===o?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div></div>`}
  if(f.type==='quickdate'){const q=[['Today',0],['Tomorrow',1],['In 3 days',3],['Next week',7]];
    return `<div class="f"><label>${esc(f.label)}</label><div class="chips">${q.map(([l,n])=>
      `<span class="fchip qd" data-act="qd" data-arg="${n}">${l}</span>`).join('')}</div>
      <input id="${id}" type="date" value="${esc(v)}" style="margin-top:8px"></div>`}
  if(f.type==='check')return `<div class="f"><label class="check"><input type="checkbox" id="${id}" ${v?'checked':''}>${esc(f.label)}</label></div>`;
  if(f.type==='textarea')return `<div class="f"><label for="${id}">${esc(f.label)}</label><textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea></div>`;
  const dl=f.list?`<datalist id="dl_${f.k}">${f.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:'';
  const inp=`<input id="${id}" name="${f.ac||f.k}" type="${f.type||'text'}" value="${esc(v)}"
    ${f.list?`list="dl_${f.k}"`:''} placeholder="${esc(f.ph||'')}" ${f.type==='number'?'inputmode="decimal"':''} ${f.type==='tel'?'inputmode="tel"':''} autocomplete="${f.ac||'off'}">`;
  const btn=f.pick&&('contacts' in navigator)?`<button type="button" data-act="pickContact">📇 Contacts</button>`:'';
  return `<div class="f"><label for="${id}">${esc(f.label)}</label>${btn?`<div class="pick">${inp}${btn}</div>`:inp}${dl}</div>`;
}
function form(title,fields,vals,onSave,onDelete){
  formState={fields,onSave,onDelete};
  let html='',i=0;const main=fields.filter(f=>!f.more),more=fields.filter(f=>f.more);
  const draw=list=>{let s='',j=0;while(j<list.length){const f=list[j];
    if(f.pair&&list[j+1]){s+=`<div class="two">${field(f,vals[f.k])}${field(list[j+1],vals[list[j+1].k])}</div>`;j+=2}else{s+=field(f,vals[f.k]);j++}}return s};
  html=draw(main)+(more.length?`<details class="more"><summary>More details</summary>${draw(more)}</details>`:'');i=fields.length;
  while(i<fields.length){const f=fields[i];
    if(f.pair&&fields[i+1]){html+=`<div class="two">${field(f,vals[f.k])}${field(fields[i+1],vals[fields[i+1].k])}</div>`;i+=2}
    else{html+=field(f,vals[f.k]);i++}}
  $('#sheetBody').innerHTML=`<form autocomplete="on" onsubmit="return false"><div class="sheet-head"><h2>${esc(title)}</h2><button class="ghost" data-act="closeForm">✕</button></div>${html}
    <div class="btnrow"><button class="primary" data-act="saveForm">Save</button>${onDelete?'<button class="danger" data-act="delForm">Delete</button>':''}</div></form>`;
  $('#sheet').classList.remove('hidden');
  const p=$('#f_person');if(p)p.addEventListener('change',()=>{const ph=$('#f_phone');if(ph&&!ph.value){
    const hit=[...live('followups')].reverse().find(x=>x.person===p.value&&x.phone);if(hit)ph.value=hit.phone}});
  const first=$('#sheetBody input[type=text],#sheetBody textarea');if(first&&!first.value&&!/iPhone|iPad/.test(navigator.userAgent))first.focus();
}
function readForm(){
  const out={};
  for(const f of formState.fields){const id='f_'+f.k;let v;
    if(f.type==='company'||f.type==='choice'){const c=document.querySelector(`input[name="${id}"]:checked`);v=c?c.value:''}
    else if(f.type==='check')v=$('#'+id).checked;
    else if(f.type==='number')v=parseFloat($('#'+id).value)||0;
    else v=$('#'+id).value.trim();
    if(f.req&&!v){toast(`${f.label} is needed`);return null}
    out[f.k]=v}
  return out;
}
async function showReader(m){
  if(!m)return;formState=null;
  const acts=`<div class="btnrow"><button data-act="gmail" data-arg="${m.id}">Open in Gmail</button><button data-act="mailTask" data-arg="${m.id}">→ Task</button>
    <button data-act="mailFu" data-arg="${m.id}">→ Follow-up</button><button class="primary" data-act="mailDone" data-arg="${m.id}">✓ Done</button></div>`;
  const head=`<div class="sheet-head"><h2 style="font-size:18px">${esc(m.subject)}</h2><button class="ghost" data-act="closeForm">✕</button></div>
    <div class="small" style="margin:4px 0 10px">${coTag(m.company)} ${esc(m.fromName)} · ${ageTxt(m.lastAt)}</div>`;
  $('#sheetBody').innerHTML=head+`<div id="rd" class="empty">Opening mail…</div>`+acts;$('#sheet').classList.remove('hidden');
  const rd=$('#rd');
  if(!m.reader){rd.innerHTML=`<div class="snip" style="-webkit-line-clamp:unset">${esc(m.snippet)}</div><p class="small">The full mail view isn't switched on for this account yet. Use "Open in Gmail" for now.</p>`;return}
  try{
    const r=await fetch(m.reader,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:db.settings.token||'',id:m.id.split(':').pop()})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'Could not open');
    if(!$('#rd'))return;
    $('#rd').outerHTML=`<div class="thread">${j.messages.map((x,i)=>{
      const body=String(x.body||'');const cut=body.search(/^\s*(On .{5,200}wrote:|-----Original Message-----|From: .+\nSent: )/m);
      const main=cut>0?body.slice(0,cut):body,quoted=cut>0?body.slice(cut):'';
      return `<details class="msg" ${i===j.messages.length-1?'open':''}><summary><b>${esc(x.from.replace(/<.*>/,'').replace(/"/g,'').trim()||x.from)}</b>
        <span class="small">· ${new Date(x.date).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></summary>
        <div class="small">To: ${esc(x.to)}${x.cc?' · Cc: '+esc(x.cc):''}</div>
        <div class="body">${esc(main.trim())}</div>
        ${quoted?`<details class="q"><summary class="small">Show quoted text</summary><div class="body">${esc(quoted)}</div></details>`:''}
        ${x.attachments&&x.attachments.length?`<div class="small" style="margin-top:6px">📎 ${x.attachments.map(esc).join(' · ')}</div>`:''}</details>`}).join('')}</div>`;
  }catch(e){if($('#rd'))$('#rd').innerHTML=`<p class="small">Couldn't load the full mail (${esc(e.message)}). Use "Open in Gmail".</p><div class="snip">${esc(m.snippet)}</div>`}
}

/* ---------- actions ---------- */
function startTimer(co){
  const lastP=(live('hours').filter(h=>h.company===co).sort((a,b)=>b.start.localeCompare(a.start))[0]||{}).project||'';
  form(`Start ${co}`,F.start(),{project:lastP,category:'Work'},v=>{
    const now=nowStamp();live('hours').filter(r=>!r.end).forEach(r=>finish(r,now));
    put('hours',{company:co,project:v.project,category:v.category||'Work',start:now,end:'',hrs:0,note:''});
    closeForm();toast(`${co} timer started`)})
}
function finish(r,end){const hrs=diffH(r.start,end);
  if(hrs<1/60)put('hours',{...r,deleted:true});else put('hours',{...r,end,hrs:+hrs.toFixed(3)});return hrs}
function stopTimer(){
  const t=T();if(!t)return;const hrs=finish(t,nowStamp());
  toast(hrs<1/60?'Timer cancelled':`Logged ${fmtH(hrs)} to ${t.company}`)
}
function hoursForm(h){
  const v=h?{...h,date:h.start.slice(0,10),from:h.start.slice(11,16),to:h.end.slice(11,16)}
    :{company:defCo(),category:'Work',date:today(),from:'',to:nowTime()};
  form(h?'Edit hours':'Log hours',F.hours(),v,x=>{
    if(!x.from||!x.to){toast('From and To are needed');return}
    const start=`${x.date}T${x.from}`;let end=`${x.date}T${x.to}`;
    if(end<=start){const d=new Date(x.date);d.setDate(d.getDate()+1);end=`${dstr(d)}T${x.to}`}
    put('hours',{...(h||{}),company:x.company||defCo(),project:x.project,category:x.category||'Work',start,end,hrs:+diffH(start,end).toFixed(3),note:x.note});closeForm()
  },h?()=>{if(del('hours',h))closeForm()}:null)
}
function taskForm(t,pre,after){
  form(t?'Edit task':'New task',F.task(!!t),t?{...t}:{company:defCo(),priority:'Normal',...(pre||{})},x=>{
    put('tasks',{...(t||{}),...x,company:x.company||defCo(),done:!!x.done,doneAt:x.done?(t&&t.doneAt)||today():''});if(after)after();closeForm()

function waNudge(f){
  let p=(f.phone||'').replace(/\D/g,'');if(p.length===11&&p[0]==='0')p=p.slice(1);if(p.length===10)p='91'+p;
  const first=(f.person||'').split(' ')[0];const me=db.settings.myName||'Shubham';
  const txt=`Hi ${first}, following up on ${f.what}${f.due?` — needed by ${fmtDate(f.due)}`:''}. Please share an update. – ${me}`;
  put('followups',{...f,lastNudged:nowStamp()});
  location.href=`https://wa.me/${p}?text=${encodeURIComponent(txt)}`;
}
async function shareText(title,text){
  if(navigator.share){try{await navigator.share({title,text});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);toast('Copied — paste it into Claude')}catch(e){prompt('Copy this:',text)}
}
async function shareFile(name,text,mime){
  const file=new File([text],name,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function tripText(t){
  const N=live('notes').filter(n=>n.tripId===t.id).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const pd=N.filter(n=>n.kind==='personalday'),pay=N.filter(n=>n.kind!=='personalday');
  const L=[`TRIP — ${t.company}: ${t.purpose}${t.city?', '+t.city:''}`,
    `Dates: ${fmtDate(t.startDate)} ${(t.startDate||'').slice(0,4)} – ${t.endDate?fmtDate(t.endDate)+' '+t.endDate.slice(0,4):'ongoing'}`,
    `Advance received: ${rupee(t.advance)}`,`Food bills handed to accounts: ${t.billsSubmitted?'Yes':'No'}`];
  if(pd.length)L.push('','Personal days (exclude from claim):',...pd.map(n=>`- ${fmtDate(n.date,true)}${n.purpose?' — '+n.purpose:''}`));
  const off=pay.filter(n=>!n.personal),per=pay.filter(n=>n.personal);
  L.push('','Payment notes (official):',...(off.length?off.map(n=>`- ${fmtDate(n.date)} ${n.time||''} — ${n.payee}${n.purpose?' — '+n.purpose:''}`):['- none']));
  if(per.length)L.push('','Personal payments (exclude):',...per.map(n=>`- ${fmtDate(n.date)} ${n.time||''} — ${n.payee}${n.purpose?' — '+n.purpose:''}`));
  return L.join('\n');
}

   <button class="ghost" data-act="editTrip" data-arg="${t.id}">Edit</button></div>
   ${compact?'':`<div style="margin-top:8px">${N.map(noteRow).join('')||empty('No notes yet. Add one when a payment won’t explain itself on the statement.')}</div>`}
   <div class="btnrow">${open?`<button data-act="newNote" data-arg="${t.id}">＋ Payment note</button>${compact?'':`<button data-act="newPday" data-arg="${t.id}">＋ Personal day</button>`}`:''}
   ${compact?'':`<button data-act="shareTrip" data-arg="${t.id}">Share for claim</button>`}
   ${!compact&&open?`<button class="primary" data-act="closeTrip" data-arg="${t.id}">Close trip</button>`:''}
   ${!compact&&!open?`<button data-act="reopenTrip" data-arg="${t.id}">Reopen</button>`:''}</div></div>`}

const waitingMail=()=>live('mail').filter(m=>m.status==='open').sort((a,b)=>String(b.lastAt).localeCompare(String(a.lastAt)));
function ageTxt(iso){const h=(Date.now()-new Date(iso))/36e5;const t=h<1?'just now':h<24?Math.floor(h)+'h':Math.floor(h/24)+'d';
  return `<span class="age ${h>48?'old':''}">${t}${h<1?'':' waiting'}</span>`}
function mailRow(m,compact){return `<div class="mail"><div data-act="openMail" data-arg="${m.id}">
  <div class="t">${esc(m.fromName)} — ${esc(m.subject)}</div>
  <div class="small">${coTag(m.company)} <b>${esc(clientOf(m))}</b> · ${ageTxt(m.lastAt)}</div>${!compact&&m.snippet?`<div class="snip">${esc(m.snippet)}</div>`:''}</div>
  <div class="acts"><button class="mini" data-act="openMail" data-arg="${m.id}">Open</button><button class="mini" data-act="mailTask" data-arg="${m.id}">→ Task</button>
  <button class="mini" data-act="mailFu" data-arg="${m.id}">→ Follow-up</button><button class="mini" data-act="mailDone" data-arg="${m.id}">✓ Done</button></div></div>`}
const PUBLIC=/^(gmail|googlemail|yahoo|outlook|hotmail|live|icloud|rediffmail|ymail|proton)\./i;
const domainOf=m=>((m.fromEmail||'').split('@')[1]||'').toLowerCase();
const clientKey=m=>{const d=domainOf(m);return !d||PUBLIC.test(d)?'@'+(m.fromEmail||m.fromName||'').toLowerCase():d};
const aliasRec=k=>live('notes').find(n=>n.kind==='client'&&n.payee===k);
function autoName(k,m){
  if(k[0]==='@')return (m&&m.fromName)||k.slice(1);
  const p=k.split('.').filter(x=>!/^(mail|email|in|www|mx|smtp)$/.test(x));let i=p.length-2;
  if(i>0&&/^(co|com|net|org|gov|ac|nic|res|edu)$/.test(p[i]))i--;
  const w=p[Math.max(0,i)]||k;return w.charAt(0).toUpperCase()+w.slice(1)}
const clientName=(k,m)=>{const a=aliasRec(k);return a&&a.purpose?a.purpose:autoName(k,m)};
const clientOf=m=>clientName(clientKey(m),m);
const mailCard=list=>`<div class="row"><div class="label grow">Mail waiting on you (${list.length})</div>${list.length>4?'<button class="mini" data-act="go" data-arg="inbox">All →</button>':''}</div>
  <div class="card">${list.slice(0,4).map(m=>mailRow(m,true)).join('')||empty(live('mail').length?'Inbox clear — nothing waiting on you.':'Mail not connected yet.')}</div>`;
function mailListHtml(){
  const f=db.mailFilter||'All',q=(db.mailQ||'').trim().toLowerCase(),sort=db.mailSort||'new';
  const hit=m=>!q||[m.fromName,m.fromEmail,m.subject,m.snippet,clientOf(m)].some(x=>String(x||'').toLowerCase().includes(q));
  const W=waitingMail().filter(m=>(f==='All'||m.company===f)&&hit(m));
  const groups=[];W.forEach(m=>{const k=clientKey(m);let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,name:clientOf(m),list:[]});g.list.push(m)});
  const newest=g=>String(g.list[0].lastAt),oldest=g=>String(g.list[g.list.length-1].lastAt);
  groups.sort(sort==='old'?(a,b)=>oldest(a).localeCompare(oldest(b)):sort==='most'?(a,b)=>b.list.length-a.list.length||newest(b).localeCompare(newest(a))
    :sort==='az'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>newest(b).localeCompare(newest(a)));
  if(sort==='old')groups.forEach(g=>g.list.reverse());
  let h=groups.length?groups.map(g=>`<div class="row" style="margin:18px 2px 6px"><div class="label grow" style="margin:0">${esc(g.name)}
      ${g.k[0]==='@'?'':`<span style="text-transform:none;font-weight:500"> · ${esc(g.k)}</span>`} (${g.list.length})</div>
      ${g.k[0]==='@'?'':`<button class="mini ghost" data-act="renameClient" data-arg="${esc(g.k)}" title="Rename">✏️</button>`}</div>
      <div class="card">${g.list.map(m=>mailRow(m)).join('')}</div>`).join('')
    :sec('Waiting on you',empty(q?`Nothing waiting matches "${esc(q)}".`:'Nothing waiting on your reply. 🎉'));
  const D=live('mail').filter(m=>m.status==='done'&&(f==='All'||m.company===f)&&hit(m)).sort((a,b)=>String(b.lastAt).localeCompare(String(a.lastAt)));
  if(D.length)h+=`<div class="label" data-act="toggleDone" data-arg="showDoneMail" style="cursor:pointer">Marked done (${D.length}) ${db.showDoneMail?'▾':'▸'}</div>`+
    (db.showDoneMail?`<div class="card">${D.slice(0,60).map(m=>`<div class="item"><div class="main"><div class="t">${esc(m.fromName)} — ${esc(m.subject)}</div>
      <div class="small">${coTag(m.company)} <b>${esc(clientOf(m))}</b> · ${fmtDate(m.lastAt)}</div></div>
      <button class="mini" data-act="reopenMail" data-arg="${m.id}">↺ Bring back</button></div>`).join('')}</div>`:'');
  return h;
}
document.addEventListener('input',e=>{if(e.target.id==='mailQ'){db.mailQ=e.target.value;save();const l=$('#mailList');if(l)l.innerHTML=mailListHtml()}});
document.addEventListener('change',e=>{if(e.target.id==='mailSort'){db.mailSort=e.target.value;save();const l=$('#mailList');if(l)l.innerHTML=mailListHtml()}});
const VIEWS={
  home(){
    const t=T(),td=today(),trip=openTrip();
    let timer='';
    if(t)timer=`<div class="card timer" style="--co:${CO_COLOR[t.company]}"><div class="logochip">${logoImg(t.company)}</div><div class="small">${esc(t.category)} · since ${t.start.slice(11,16)}${t.start.slice(0,10)!==td?' ('+fmtDate(t.start)+')':''}</div>
      <div class="big">${esc(t.project||'No project')}</div><div class="elapsed" id="elapsed">${fmtH(diffH(t.start,new Date()))}</div>
      <button class="stop" data-act="stop">Stop</button></div>`;
    const cos=`<div class="card"><div class="label">${t?'Switch to':'Start working on'}</div><div class="cos">${COS.map(c=>
      `<button class="co ${t&&t.company===c?'run':''}" style="--co:${CO_COLOR[c]}" data-act="start" data-arg="${c}" aria-label="${c}">${logoImg(c)}<span>${t&&t.company===c?'● Running':'Start ▸'}</span></button>`).join('')}</div></div>`;
    const quick=`<div class="quick"><button data-act="newTask">＋ Task</button><button data-act="newFu">＋ Follow-up</button>
      ${trip?'<button data-act="newNote">＋ Payment note</button>':'<button data-act="newTrip">＋ Start trip</button>'}<button data-act="newHours">＋ Log hours</button></div>`;
    const tripH=trip?`<div class="label">On trip</div>`+tripCard(trip,true):'';
    const H=doneH().filter(x=>x.start.startsWith(td));
    const run=t&&t.start.startsWith(td)?diffH(t.start,new Date()):0;
    const todayH=sec('Today',`<div class="row"><div class="grow small">Logged today</div><b>${fmtH(sum(H)+run)}</b></div>
      ${COS.map(c=>{const v=sum(H.filter(x=>x.company===c))+(t&&t.company===c?run:0);return v?`<div class="row small"><span class="dot" style="--co:${CO_COLOR[c]}"></span><span class="grow">${c}</span>${fmtH(v)}</div>`:''}).join('')}`);
    const byDue=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999');
    if(WIDE.matches){
      const fus=live('followups').filter(f=>f.status!=='done').sort(byDue);
      const tks=live('tasks').filter(x=>!x.done).sort((a,b)=>byDue(a,b)||(a.priority==='High'?-1:b.priority==='High'?1:0));
      const lateF=fus.filter(f=>f.due&&f.due<=td).length,lateT=tks.filter(x=>x.due&&x.due<=td).length;
      return `<div class="dash">
        <div>${timer}${cos}${quick}${tripH}${todayH}</div>
        <div>${mailCard(waitingMail())}<div class="row"><div class="label grow">Waiting on (${fus.length})${lateF?` · <span class="over">${lateF} due</span>`:''}</div><button class="primary" data-act="newFu">＋ Follow-up</button></div>
          <div class="card">${fus.map(fuRow).join('')||empty('Nobody to chase.')}</div></div>
        <div><div class="row"><div class="label grow">Open tasks (${tks.length})${lateT?` · <span class="over">${lateT} due</span>`:''}</div><button class="primary" data-act="newTask">＋ Task</button></div>
          <div class="card">${tks.map(taskRow).join('')||empty('No open tasks.')}</div></div>
      </div>`;
    }
    const fus=live('followups').filter(f=>f.status!=='done'&&f.due&&f.due<=td).sort(byDue);
    const tks=live('tasks').filter(x=>!x.done&&x.due&&x.due<=td).sort(byDue);
    return timer+cos+quick+tripH+mailCard(waitingMail())+sec(`Follow-ups due (${fus.length})`,fus.map(fuRow).join('')||empty('Nobody to chase today.'))
      +sec(`Tasks due (${tks.length})`,tks.map(taskRow).join('')||empty('Nothing due today.'))+todayH;
  },
  inbox(){
    const f=db.mailFilter||'All',all=live('mail');
    if(!all.length)return sec('Mail',empty('No mail has come in yet. Once the mail scanner runs in each company account, anything waiting on your reply shows up here within 15 minutes.'));
    const sorts=[['new','Newest'],['old','Oldest'],['most','Most waiting'],['az','A–Z']];
    return `<div class="row wrap gap" style="margin:6px 0">${['All',...COS].map(c=>{const n=waitingMail().filter(m=>c==='All'||m.company===c).length;
        return `<span class="fchip ${f===c?'on':''}" data-act="mailFilter" data-arg="${c}">${c}${n?' · '+n:''}</span>`}).join('')}</div>
      <div class="row gap" style="margin:8px 0 4px"><input id="mailQ" type="search" placeholder="Search client, person or subject" value="${esc(db.mailQ||'')}" autocomplete="off" style="flex:1;min-width:0">
        <select id="mailSort" style="width:auto">${sorts.map(([k,l])=>`<option value="${k}" ${(db.mailSort||'new')===k?'selected':''}>${l}</option>`).join('')}</select></div>
      <div id="mailList">${mailListHtml()}</div>`;
  },
  hours(){
    const H=doneH(),ws=weekStart(),ms=today().slice(0,7);
    const w=c=>sum(H.filter(x=>x.company===c&&x.start.slice(0,10)>=ws)),m=c=>sum(H.filter(x=>x.company===c&&x.start.startsWith(ms)));
    const tr=sum(H.filter(x=>x.category==='Travel'&&x.start.startsWith(ms)));
    let h=`<div class="card"><table><tr><th></th><th>This week</th><th>${MO[+ms.slice(5)-1]}</th></tr>
      ${COS.map(c=>`<tr><td>${c}</td><td>${fmtH(w(c))}</td><td>${fmtH(m(c))}</td></tr>`).join('')}
      <tr><td>Total</td><td>${fmtH(COS.reduce((a,c)=>a+w(c),0))}</td><td>${fmtH(COS.reduce((a,c)=>a+m(c),0))}</td></tr></table>
      <div class="small" style="margin-top:6px">Travel this month: ${fmtH(tr)}</div>
      <div class="btnrow"><button data-act="newHours">＋ Log hours</button><button data-act="exportHours">Export month</button></div></div>`;
    const cut=new Date();cut.setDate(cut.getDate()-45);const cs=dstr(cut);
    const L=H.filter(x=>x.start.slice(0,10)>=cs).sort((a,b)=>b.start.localeCompare(a.start));
    const days=uniq(L.map(x=>x.start.slice(0,10))).reverse();
    h+=days.map(d=>{const D=L.filter(x=>x.start.startsWith(d));return `<div class="label">${fmtDate(d,true)} · ${fmtH(sum(D))}</div><div class="card">${D.map(hoursRow).join('')}</div>`}).join('')
      ||sec('Entries',empty('Tap a company on Home to start the timer.'));
    return h;
  },
  trips(){
    const o=openTrip();let h=o?`<div class="label">Open trip</div>`+tripCard(o,false)
      :`<div class="card"><div class="empty">No trip open.</div><div class="btnrow"><button class="primary" data-act="newTrip">Start a trip</button></div></div>`;
    const past=live('trips').filter(t=>t.status==='closed').sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
    if(past.length)h+=`<div class="label">Past trips</div>`+past.map(t=>db.showTrip===t.id?tripCard(t,false)
      :`<div class="card" data-act="showTrip" data-arg="${t.id}"><div class="row"><span class="dot" style="--co:${CO_COLOR[t.company]}"></span>
        <div class="grow"><div class="t" style="font-weight:600">${esc(t.purpose)}</div><div class="small">${esc(t.company)} · ${esc(t.city||'')} · ${fmtDate(t.startDate)}${t.endDate?' – '+fmtDate(t.endDate):''}</div></div>›</div></div>`).join('');
    return h;
  },
  tasks(){
    const f=db.taskFilter,T=live('tasks').filter(t=>f==='All'||t.company===f);
    const ord=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.priority==='High'?-1:b.priority==='High'?1:0);
    const open=T.filter(t=>!t.done).sort(ord),done=T.filter(t=>t.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
    let h=`<div class="row wrap gap" style="margin:6px 0">${['All',...COS].map(c=>`<span class="fchip ${f===c?'on':''}" data-act="taskFilter" data-arg="${c}">${c}</span>`).join('')}
      <span class="grow"></span><button class="primary" data-act="newTask">＋ Task</button></div>`;
    const groups=uniq(open.map(t=>t.project||'—'));
    if(!open.length)h+=sec('Open',empty('No open tasks.'));
    groups.forEach(g=>{const G=open.filter(t=>(t.project||'—')===g);h+=sec(`${esc(g)} (${G.length})`,G.map(taskRow).join(''))});
    if(done.length)h+=`<div class="label" data-act="toggleDone" data-arg="showDoneTasks">Done (${done.length}) ${db.showDoneTasks?'▾':'▸'}</div>`+
      (db.showDoneTasks?`<div class="card">${done.slice(0,50).map(taskRow).join('')}</div>`:'');
    return h;
  },
  followups(){
    const A=live('followups'),open=A.filter(f=>f.status!=='done').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));
    const done=A.filter(f=>f.status==='done').sort((a,b)=>b.updatedAt-a.updatedAt);
    let h=`<div class="row" style="margin:6px 0"><span class="grow small">${open.length} open</span><button class="primary" data-act="newFu">＋ Follow-up</button></div>`;
    const people=uniq(open.map(f=>f.person));
    h+=people.length?people.map(p=>{const P=open.filter(f=>f.person===p);return sec(`${esc(p)} (${P.length})`,P.map(fuRow).join(''))}).join('')
      :sec('Open',empty('Nobody to chase. Add one when you hand something to the team.'));
    if(done.length)h+=`<div class="label" data-act="toggleDone" data-arg="showDoneFu">Closed (${done.length}) ${db.showDoneFu?'▾':'▸'}</div>`+
      (db.showDoneFu?`<div class="card">${done.slice(0,50).map(fuRow).join('')}</div>`:'');
    return h;
  },
  settings(){
    const s=db.settings,n=Object.keys(db.queue).length;
    return `<div class="card"><div class="label">Google Sheet link</div>
      <div class="f"><label for="s_url">Web app URL (from Apps Script)</label><input id="s_url" value="${esc(s.url||'')}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>
      <div class="f"><label for="s_token">Access key</label><input id="s_token" value="${esc(s.token||'')}" autocomplete="off"></div>
      <div class="f"><label for="s_name">Name for WhatsApp sign-off</label><input id="s_name" value="${esc(s.myName||'Shubham')}"></div>
      <div class="btnrow"><button class="primary" data-act="saveSettings">Save & sync</button><button data-act="syncNow">Sync now</button></div>
      <div class="small" style="margin-top:10px">${n} change${n===1?'':'s'} waiting · last synced ${s.lastSync?new Date(s.lastSync).toLocaleString('en-IN'):'never'}</div></div>
      <div class="card"><div class="label">Data</div><div class="btnrow"><button data-act="backup">Backup file</button><button data-act="resync">Re-send all to Sheet</button></div>
      <div class="small" style="margin-top:8px">Everything is saved on this device first and copied to your Sheet whenever you're online.</div></div>
      <div class="btnrow"><button data-act="go" data-arg="home">← Back</button></div>`;
  }
};
function render(){
  if(!$('#sheet').classList.contains('hidden'))return;
  const v=VIEWS[db.view]?db.view:'home';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#title').textContent={inbox:'Inbox',home:'WorkLog',hours:'Hours',trips:'Trips',tasks:'Tasks',followups:'Follow-ups',settings:'Settings'}[v];
  const fq=document.activeElement&&document.activeElement.id==='mailQ'?document.activeElement.selectionStart:null;
  $('#main').innerHTML=VIEWS[v]();
  if(fq!==null&&$('#mailQ')){const q=$('#mailQ');q.focus();q.setSelectionRange(fq,fq)}setStatus();applyAccent();coBar();
  const n=waitingMail().length,bd=$('#mailBadge');bd.textContent=n;bd.classList.toggle('on',n>0);
}
setInterval(()=>{const t=T(),e=$('#elapsed');if(e&&t)e.textContent=fmtH(diffH(t.start,new Date()));coBar()},15000);
setInterval(()=>{if(document.visibilityState==='visible'&&!syncing)sync(false)},60000);
WIDE.addEventListener&&WIDE.addEventListener('change',()=>render());
if(db.timer){const t=db.timer;delete db.timer;const r={id:uid(),company:t.company,project:t.project,category:t.category,start:t.start,end:'',hrs:0,note:'',updatedAt:Date.now()};
  db.hours.push(r);db.queue['hours:'+r.id]={t:'hours',r};save()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){render();sync(false)}});
addEventListener('online',()=>sync(false));addEventListener('offline',()=>setStatus());
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();sync(false);
</script>
